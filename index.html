<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cover Slide — Stop Selling Your Struggle</title>
  
  <!-- Fonts: Montserrat (900), Instrument Sans, Instrument Serif, DM Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Instrument+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&family=Montserrat:wght@900&display=swap" rel="stylesheet">
  
  <!-- FontAwesome CDN for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #060608;
      font-family: 'Instrument Sans', sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 0;
    }

    /* Standard 1080x1920 Canvas Slide */
    .slide {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      margin-bottom: 80px;
      padding: 90px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.8);
      background-size: cover;
      background-position: center;
    }

    /* Typography Hierarchy */
    .main-word {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 0.85;
      letter-spacing: -4px;
      word-break: break-word;
      z-index: 10;
      position: relative;
      margin: 30px 0;
    }

    .main-word canvas {
      display: block;
      height: auto;
      max-width: 100%;
    }

    .text-glow canvas {
      filter: drop-shadow(0 0 30px currentColor);
    }

    .font-serif { font-family: 'Instrument Serif', serif; }
    .font-sans { font-family: 'Instrument Sans', sans-serif; }
    .font-mono { font-family: 'DM Mono', monospace; }

    .header-tag {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'DM Mono', monospace;
      font-size: 24px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.85;
      z-index: 10;
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 20px;
    }

    .footer-tag {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'DM Mono', monospace;
      font-size: 22px;
      z-index: 10;
      border-top: 2px solid rgba(255, 255, 255, 0.15);
      padding-top: 20px;
    }

    .story-caption {
      font-size: 42px;
      line-height: 1.35;
      max-width: 820px;
      z-index: 10;
      position: relative;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 28px;
      border-radius: 100px;
      font-size: 22px;
      font-weight: 600;
      z-index: 10;
    }

    /* Unique CSS-Only Art Components */
    .css-art-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Artwork Style: Stop Symbol */
    .css-art-octagon {
      width: 600px;
      height: 600px;
      background: linear-gradient(135deg, #ff2a5f, #800020);
      clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
      box-shadow: 0 0 100px rgba(255, 42, 95, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 8px solid rgba(255, 255, 255, 0.1);
      opacity: 0.6;
    }

    /* Themes */
    .theme-crimson { background: #1a0507; color: #fff; }

    /* Highlights */
    .text-glow { text-shadow: 0 0 30px currentColor; }
  </style>
</head>
<body>

  <!-- ==================== COVER FRAME ==================== -->
  <div class="slide theme-crimson">
    <div class="header-tag">
      <span><i class="fa-solid fa-layer-group"></i> Masterclass Cover</span>
      <span>00 // FRAME</span>
    </div>
    
    <div class="css-art-container">
      <div class="css-art-octagon">
        <i class="fa-solid fa-ban" style="font-size: 220px; color: rgba(255,255,255,0.8);"></i>
      </div>
    </div>

    <div>
      <div class="badge font-mono" style="background: rgba(255, 42, 95, 0.2); color: #ff2a5f; border: 1px solid #ff2a5f;">
        <i class="fa-solid fa-triangle-exclamation"></i> PARADIGM SHIFT 🛑
      </div>
      
      <!-- Added <br> tags so the Javascript splits the words into new lines nicely -->
      <h1 class="main-word text-glow" style="font-size: 130px; color: #ff2a5f;">
        STOP<br>SELLING<br>YOUR<br>STRUGGLE
      </h1>
      
      <p class="story-caption font-serif" style="color: #f0e6d2;">
        Value Over Time — 60 Slide Poster Art Direction.
      </p>
    </div>

    <div class="footer-tag font-mono">
      <span><i class="fa-solid fa-compass"></i> POSITIONING MASTERCLASS</span>
      <span>@callistra.design</span>
    </div>
  </div>

  <!-- Script: Pixel Displace Text Effect Engine -->
  <script>
    function getSpatialRandom(x, y) {
      let n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
      return n - Math.floor(n);
    }

    function renderDisplacedTextForElement(el) {
      // innerText respects the <br> tags and converts them to \n
      const text = el.innerText.trim();
      if (!text) return;

      const computedStyle = window.getComputedStyle(el);
      const fontSize = parseFloat(computedStyle.fontSize) || 140;
      const color = computedStyle.color || '#ffffff';
      
      const origBlockSize = 50; // Grid Block Size specified
      const origDrift = 15;     // Scatter Amount specified

      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.font = `900 ${fontSize}px "Montserrat", sans-serif`;
      
      const lines = text.split('\n');
      let maxLineWidth = 0;
      lines.forEach(line => {
        const w = tempCtx.measureText(line).width;
        if (w > maxLineWidth) maxLineWidth = w;
      });

      const lineHeight = fontSize * 0.95;
      const textHeight = lines.length * lineHeight;
      
      const padding = origDrift * 2 + 40;
      const width = Math.ceil(maxLineWidth + padding * 2);
      const height = Math.ceil(textHeight + padding * 2);

      const offscreen = document.createElement('canvas');
      offscreen.width = width;
      offscreen.height = height;
      const octx = offscreen.getContext('2d');

      octx.font = `900 ${fontSize}px "Montserrat", sans-serif`;
      octx.textAlign = 'left';
      octx.textBaseline = 'middle';
      octx.fillStyle = color;

      let startY = (height / 2) - (textHeight / 2) + (lineHeight / 2);
      lines.forEach((line, index) => {
        octx.fillText(line, padding, startY + (index * lineHeight));
      });

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');

      const sourceData = octx.getImageData(0, 0, width, height);
      const targetData = ctx.createImageData(width, height);
      const sourceBuffer = new Uint32Array(sourceData.data.buffer);
      const targetBuffer = new Uint32Array(targetData.data.buffer);

      for (let y = 0; y < height; y += origBlockSize) {
        for (let x = 0; x < width; x += origBlockSize) {
          const randX = getSpatialRandom(x, y);
          const randY = getSpatialRandom(x + 100, y + 100);

          const driftOffsetX = Math.round((randX - 0.5) * origDrift);
          const driftOffsetY = Math.round((randY - 0.5) * origDrift);

          const blockW = Math.min(origBlockSize, width - x);
          const blockH = Math.min(origBlockSize, height - y);

          for (let by = 0; by < blockH; by++) {
            const sy = y + by;
            const dy = sy + driftOffsetY;

            if (dy >= 0 && dy < height) {
              for (let bx = 0; bx < blockW; bx++) {
                const sx = x + bx;
                const dx = sx + driftOffsetX;

                if (dx >= 0 && dx < width && sy >= 0 && sx >= 0 && sy < height && sx < width) {
                  const sourcePixel = sourceBuffer[sy * width + sx];
                  if (sourcePixel !== 0) {
                    targetBuffer[dy * width + dx] = sourcePixel;
                  }
                }
              }
            }
          }
        }
      }

      ctx.putImageData(targetData, 0, 0);

      el.innerHTML = '';
      el.appendChild(canvas);
      el.style.fontSize = '0px';
      el.style.lineHeight = '0';
    }

    document.fonts.ready.then(() => {
      document.querySelectorAll('.main-word').forEach(el => {
        renderDisplacedTextForElement(el);
      });
    });
  </script>
</body>
</html>
