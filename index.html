<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>COMING SOON - 100 Carousel Slides</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050505;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 0;
    }

    /* 1080 x 1920 Portrait Reels / Story Ratio */
    .slide {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      margin-bottom: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>

  <!-- Algorithm 1: Glitch / Slice / CRT Element -->
  <script>
  class GlitchTextElement extends HTMLElement {
      static get observedAttributes() {
          return ['text', 'fringe', 'shear', 'chaos', 'font-size', 'color', 'font-family', 'font-weight'];
      }

      constructor() {
          super();
          this.canvas = document.createElement('canvas');
          this.ctx = this.canvas.getContext('2d');
          this.style.display = 'inline-block';
          this.style.maxHeight = '100%';
      }

      connectedCallback() {
          if (!this.contains(this.canvas)) {
              this.appendChild(this.canvas);
          }
          if (document.fonts) {
              document.fonts.ready.then(() => this.render());
          }
          this.render();
      }

      attributeChangedCallback() {
          this.render();
      }

      getSpatialRandom(x, y) {
          let n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
          return n - Math.floor(n);
      }

      render() {
          if (!this.ctx) return;

          const rawText = this.getAttribute('text') || this.innerText.trim() || 'COMING SOON';
          const text = rawText.replace(/\\n/g, '\n');
          const fringe = Math.max(1, parseInt(this.getAttribute('fringe')) || 8);
          const shear = parseInt(this.getAttribute('shear')) || 60;
          const chaos = (parseInt(this.getAttribute('chaos')) ?? 65) / 100;
          const fontSize = parseInt(this.getAttribute('font-size')) || 100;
          const color = this.getAttribute('color') || '#1b1a18';
          const fontFamily = this.getAttribute('font-family') || 'Montserrat, sans-serif';
          const fontWeight = this.getAttribute('font-weight') || '900';

          const lines = text.split('\n');
          
          const measureCanvas = document.createElement('canvas');
          const mctx = measureCanvas.getContext('2d');
          mctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;

          let maxTextWidth = 1;
          lines.forEach(line => {
              const w = mctx.measureText(line).width;
              if (w > maxTextWidth) maxTextWidth = w;
          });

          const lineHeight = fontSize * 1.1;
          const textTotalHeight = lines.length * lineHeight;

          const paddingX = Math.abs(shear) * 2 + 40;
          const paddingY = 20;

          const targetWidth = Math.ceil(maxTextWidth + paddingX);
          const targetHeight = Math.ceil(textTotalHeight + paddingY);

          this.canvas.width = targetWidth;
          this.canvas.height = targetHeight;

          const offscreen = document.createElement('canvas');
          offscreen.width = targetWidth;
          offscreen.height = targetHeight;
          const octx = offscreen.getContext('2d');

          octx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
          octx.textAlign = 'center';
          octx.textBaseline = 'middle';
          octx.fillStyle = color;

          const startY = (targetHeight / 2) - (textTotalHeight / 2) + (lineHeight / 2);
          lines.forEach((line, index) => {
              octx.fillText(line, targetWidth / 2, startY + (index * lineHeight));
          });

          const sourceData = octx.getImageData(0, 0, targetWidth, targetHeight);
          const targetData = this.ctx.createImageData(targetWidth, targetHeight);
          const sourceBuffer = new Uint32Array(sourceData.data.buffer);
          const targetBuffer = new Uint32Array(targetData.data.buffer);

          for (let dy = 0; dy < targetHeight; dy++) {
              const band = Math.floor(dy / fringe);
              const dir = (band % 2 === 0) ? 1 : -1;

              const waveShift = Math.sin(band * 0.4) * shear;
              const macroClump = this.getSpatialRandom(0, Math.floor(band / 3));
              const microNoise = this.getSpatialRandom(0, band);
              const chaosIntensity = (macroClump * 1.5 + microNoise * 0.5);
              const chaoticShift = dir * chaosIntensity * shear;

              const shiftAmount = (waveShift * (1 - chaos)) + (chaoticShift * chaos);
              const shiftX = Math.round(shiftAmount);

              const rowOffset = dy * targetWidth;
              for (let dx = 0; dx < targetWidth; dx++) {
                  const sx = dx - shiftX;
                  if (sx >= 0 && sx < targetWidth) {
                      const sourcePixel = sourceBuffer[rowOffset + sx];
                      if (sourcePixel !== 0) {
                          targetBuffer[rowOffset + dx] = sourcePixel;
                      }
                  }
              }
          }

          this.ctx.putImageData(targetData, 0, 0);
      }
  }

  if (!customElements.get('glitch-text')) {
      customElements.define('glitch-text', GlitchTextElement);
  }
  </script>

  <!-- Algorithm 2: Broken Glass Element -->
  <script>
  class BrokenGlassTextElement extends HTMLElement {
      static get observedAttributes() {
          return ['text', 'strength', 'detail', 'font-size', 'color', 'font-family', 'font-weight'];
      }

      constructor() {
          super();
          this.canvas = document.createElement('canvas');
          this.ctx = this.canvas.getContext('2d');
          this.style.display = 'inline-block';
          this.style.maxHeight = '100%';
      }

      connectedCallback() {
          if (!this.contains(this.canvas)) {
              this.appendChild(this.canvas);
          }
          if (document.fonts) {
              document.fonts.ready.then(() => this.render());
          }
          this.render();
      }

      attributeChangedCallback() {
          this.render();
      }

      getSpatialRandom(x, y) {
          let n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
          return n - Math.floor(n);
      }

      render() {
          if (!this.ctx) return;

          const rawText = this.getAttribute('text') || this.innerText.trim() || 'COMING SOON';
          const text = rawText.replace(/\\n/g, '\n');
          const strength = Math.max(0, parseInt(this.getAttribute('strength')) ?? 45);
          const detail = Math.max(10, parseInt(this.getAttribute('detail')) ?? 60);
          const fontSize = parseInt(this.getAttribute('font-size')) || 100;
          const color = this.getAttribute('color') || '#1b1a18';
          const fontFamily = this.getAttribute('font-family') || 'Montserrat, sans-serif';
          const fontWeight = this.getAttribute('font-weight') || '900';

          const lines = text.split('\n');

          const measureCanvas = document.createElement('canvas');
          const mctx = measureCanvas.getContext('2d');
          mctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;

          let maxTextWidth = 1;
          lines.forEach(line => {
              const w = mctx.measureText(line).width;
              if (w > maxTextWidth) maxTextWidth = w;
          });

          const lineHeight = fontSize * 1.1;
          const textTotalHeight = lines.length * lineHeight;

          const maxDisplacement = strength * 3;
          const paddingX = maxDisplacement * 2 + 40;
          const paddingY = maxDisplacement * 2 + 40;

          const targetWidth = Math.ceil(maxTextWidth + paddingX);
          const targetHeight = Math.ceil(textTotalHeight + paddingY);

          this.canvas.width = targetWidth;
          this.canvas.height = targetHeight;

          const offscreen = document.createElement('canvas');
          offscreen.width = targetWidth;
          offscreen.height = targetHeight;
          const octx = offscreen.getContext('2d');

          octx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
          octx.textAlign = 'center';
          octx.textBaseline = 'middle';
          octx.fillStyle = color;

          const startY = (targetHeight / 2) - (textTotalHeight / 2) + (lineHeight / 2);
          lines.forEach((line, index) => {
              octx.fillText(line, targetWidth / 2, startY + (index * lineHeight));
          });

          const sourceData = octx.getImageData(0, 0, targetWidth, targetHeight);
          const targetData = this.ctx.createImageData(targetWidth, targetHeight);
          const sourceBuffer = new Uint32Array(sourceData.data.buffer);
          const targetBuffer = new Uint32Array(targetData.data.buffer);

          if (strength === 0) {
              targetBuffer.set(sourceBuffer);
              this.ctx.putImageData(targetData, 0, 0);
              return;
          }

          const cx = (targetWidth / 2) + 10;
          const cy = (targetHeight / 2) - 5;
          const maxR = Math.sqrt(cx * cx + cy * cy);
          const numRings = Math.floor(detail / 10) + 3;

          const shardCache = new Map();
          const getSpatialRandom = this.getSpatialRandom;

          function getShardData(sector, ring, sectorsInRing) {
              const id = sector + ring * 10000;
              if (shardCache.has(id)) return shardCache.get(id);

              const seed1 = getSpatialRandom(sector + 1, ring + 1);
              const seed2 = getSpatialRandom(ring + 2, sector + 2);
              const seed3 = getSpatialRandom(sector + 3, ring + 3);

              const sectorAngleSpan = (Math.PI * 2) / sectorsInRing;
              const phase = ring * 0.5;
              const shardAngle = (sector + 0.5) * sectorAngleSpan - Math.PI - phase;

              const ringRatio = (ring + 1) / numRings;

              const moveDist = strength * Math.pow(ringRatio, 1.5) * (seed1 * 2);
              const tx = Math.cos(shardAngle) * moveDist;
              const ty = Math.sin(shardAngle) * moveDist;

              const maxRot = 0.15;
              const rotAngle = (seed2 - 0.5) * maxRot * (strength / 100) * ringRatio;
              const shardScale = 1.0 - (seed3 * 0.03 * (strength / 100));

              const rCenter = Math.pow((ring + 0.5) / numRings, 0.7) * maxR;
              const cxShard = cx + Math.cos(shardAngle) * rCenter;
              const cyShard = cy + Math.sin(shardAngle) * rCenter;

              const cosRot = Math.cos(rotAngle);
              const sinRot = Math.sin(rotAngle);

              const data = { tx, ty, cosRot, sinRot, shardScale, cxShard, cyShard };
              shardCache.set(id, data);
              return data;
          }

          for (let y = 0; y < targetHeight; y++) {
              const rowOffset = y * targetWidth;
              const dy = y - cy;

              for (let x = 0; x < targetWidth; x++) {
                  const sourcePixel = sourceBuffer[rowOffset + x];
                  if (sourcePixel === 0) continue;

                  const dx = x - cx;
                  const r = Math.sqrt(dx * dx + dy * dy);
                  const theta = Math.atan2(dy, dx);

                  const noiseTheta = Math.sin(r * 0.05) * 0.15 + Math.sin(x * 0.02) * 0.1;
                  const noiseR = Math.sin(theta * 12) * 15;

                  const thetaJ = theta + noiseTheta;
                  const rJ = Math.max(0, r + noiseR);
                  const normalizedR = Math.min(1, rJ / maxR);

                  const ring = Math.floor(Math.pow(normalizedR, 0.7) * numRings);
                  const boundedRing = Math.min(ring, numRings - 1);

                  const sectorsInRing = Math.max(4, Math.floor((boundedRing + 1) * (detail / 12)));
                  const sectorPhase = boundedRing * 0.5;

                  let normalizedTheta = (thetaJ + Math.PI + sectorPhase) % (Math.PI * 2);
                  if (normalizedTheta < 0) normalizedTheta += Math.PI * 2;

                  const sector = Math.floor(normalizedTheta / ((Math.PI * 2) / sectorsInRing));

                  const shard = getShardData(sector, boundedRing, sectorsInRing);

                  let lx = x - shard.cxShard;
                  let ly = y - shard.cyShard;

                  lx *= shard.shardScale;
                  ly *= shard.shardScale;

                  const nx = lx * shard.cosRot - ly * shard.sinRot;
                  const ny = lx * shard.sinRot + ly * shard.cosRot;

                  const fx = Math.round(nx + shard.cxShard + shard.tx);
                  const fy = Math.round(ny + shard.cyShard + shard.ty);

                  if (fx >= 0 && fx < targetWidth && fy >= 0 && fy < targetHeight) {
                      targetBuffer[fy * targetWidth + fx] = sourcePixel;

                      if (fx + 1 < targetWidth) {
                          targetBuffer[fy * targetWidth + fx + 1] = sourcePixel;
                      }
                  }
              }
          }

          this.ctx.putImageData(targetData, 0, 0);
      }
  }

  if (!customElements.get('broken-glass-text')) {
      customElements.define('broken-glass-text', BrokenGlassTextElement);
  }
  </script>

  <!-- Algorithm 3: Pixel Displace Element -->
  <script>
  class PixelDisplaceTextElement extends HTMLElement {
      static get observedAttributes() {
          return ['text', 'block-size', 'drift', 'font-size', 'color', 'font-family', 'font-weight'];
      }

      constructor() {
          super();
          this.canvas = document.createElement('canvas');
          this.ctx = this.canvas.getContext('2d');
          this.style.display = 'inline-block';
          this.style.maxHeight = '100%';
      }

      connectedCallback() {
          if (!this.contains(this.canvas)) {
              this.appendChild(this.canvas);
          }
          if (document.fonts) {
              document.fonts.ready.then(() => this.render());
          }
          this.render();
      }

      attributeChangedCallback() {
          this.render();
      }

      getSpatialRandom(x, y) {
          let n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
          return n - Math.floor(n);
      }

      render() {
          if (!this.ctx) return;

          const rawText = this.getAttribute('text') || this.innerText.trim() || 'COMING SOON';
          const text = rawText.replace(/\\n/g, '\n');
          const blockSize = Math.max(1, parseInt(this.getAttribute('block-size')) || 20);
          const drift = parseInt(this.getAttribute('drift')) ?? 15;
          const fontSize = parseInt(this.getAttribute('font-size')) || 100;
          const color = this.getAttribute('color') || '#1b1a18';
          const fontFamily = this.getAttribute('font-family') || 'Montserrat, sans-serif';
          const fontWeight = this.getAttribute('font-weight') || '900';

          const lines = text.split('\n');
          
          const measureCanvas = document.createElement('canvas');
          const mctx = measureCanvas.getContext('2d');
          mctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;

          let maxTextWidth = 1;
          lines.forEach(line => {
              const w = mctx.measureText(line).width;
              if (w > maxTextWidth) maxTextWidth = w;
          });

          const lineHeight = fontSize * 1.1;
          const textTotalHeight = lines.length * lineHeight;

          const paddingX = Math.abs(drift) * 2 + 40;
          const paddingY = Math.abs(drift) * 2 + 40;

          const targetWidth = Math.ceil(maxTextWidth + paddingX);
          const targetHeight = Math.ceil(textTotalHeight + paddingY);

          this.canvas.width = targetWidth;
          this.canvas.height = targetHeight;

          const offscreen = document.createElement('canvas');
          offscreen.width = targetWidth;
          offscreen.height = targetHeight;
          const octx = offscreen.getContext('2d');

          octx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
          octx.textAlign = 'center';
          octx.textBaseline = 'middle';
          octx.fillStyle = color;

          const startY = (targetHeight / 2) - (textTotalHeight / 2) + (lineHeight / 2);
          lines.forEach((line, index) => {
              octx.fillText(line, targetWidth / 2, startY + (index * lineHeight));
          });

          const sourceData = octx.getImageData(0, 0, targetWidth, targetHeight);
          const targetData = this.ctx.createImageData(targetWidth, targetHeight);
          const sourceBuffer = new Uint32Array(sourceData.data.buffer);
          const targetBuffer = new Uint32Array(targetData.data.buffer);

          for (let y = 0; y < targetHeight; y += blockSize) {
              for (let x = 0; x < targetWidth; x += blockSize) {
                  const randX = this.getSpatialRandom(x, y);
                  const randY = this.getSpatialRandom(x + 100, y + 100);

                  const driftOffsetX = Math.round((randX - 0.5) * drift);
                  const driftOffsetY = Math.round((randY - 0.5) * drift);

                  const blockW = Math.min(blockSize, targetWidth - x);
                  const blockH = Math.min(blockSize, targetHeight - y);

                  for (let by = 0; by < blockH; by++) {
                      const sy = x === 0 && y === 0 ? 0 : y + by;
                      const dy = sy + driftOffsetY;

                      if (dy >= 0 && dy < targetHeight) {
                          for (let bx = 0; bx < blockW; bx++) {
                              const sx = x + bx;
                              const dx = sx + driftOffsetX;

                              if (dx >= 0 && dx < targetWidth && sy >= 0 && sx >= 0 && sy < targetHeight && sx < targetWidth) {
                                  const sourcePixel = sourceBuffer[sy * targetWidth + sx];
                                  if (sourcePixel !== 0) {
                                      targetBuffer[dy * targetWidth + dx] = sourcePixel;
                                  }
                              }
                          }
                      }
                  }
              }
          }

          this.ctx.putImageData(targetData, 0, 0);
      }
  }

  if (!customElements.get('pixel-displace-text')) {
      customElements.define('pixel-displace-text', PixelDisplaceTextElement);
  }
  </script>

<body>

  <div id="slides-container"></div>

  <script>
    // Generates high-contrast, aesthetically harmonious color combinations
    function getHarmoniousColors(index) {
      const pseudo = (seed) => {
        let x = Math.sin(index * 83.17 + seed * 19.31) * 43758.5453;
        return x - Math.floor(x);
      };

      const baseHue = Math.floor(pseudo(1) * 360);
      const isDark = pseudo(2) > 0.25; // 75% vibrant dark theme, 25% vibrant pastel/light

      let bgSat, bgLight, textHue, textSat, textLight;

      if (isDark) {
        bgSat = Math.floor(20 + pseudo(3) * 50);
        bgLight = Math.floor(6 + pseudo(4) * 12);

        const hueMode = pseudo(5);
        if (hueMode < 0.45) {
          textHue = (baseHue + 150 + Math.floor(pseudo(6) * 60)) % 360;
        } else if (hueMode < 0.75) {
          textHue = (baseHue + 30 + Math.floor(pseudo(6) * 30)) % 360;
        } else {
          textHue = baseHue;
        }

        textSat = Math.floor(75 + pseudo(7) * 25);
        textLight = Math.floor(75 + pseudo(8) * 20);
      } else {
        bgSat = Math.floor(45 + pseudo(3) * 40);
        bgLight = Math.floor(78 + pseudo(4) * 16);

        textHue = (baseHue + 180 + Math.floor((pseudo(5) - 0.5) * 40)) % 360;
        textSat = Math.floor(70 + pseudo(7) * 30);
        textLight = Math.floor(6 + pseudo(8) * 14);
      }

      return {
        bg: `hsl(${baseHue}, ${bgSat}%, ${bgLight}%)`,
        text: `hsl(${textHue}, ${textSat}%, ${textLight}%)`
      };
    }

    const container = document.getElementById('slides-container');
    const TOTAL_SLIDES = 100;
    const elementsToRender = [];

    // Construct 100 Slides
    for (let i = 1; i <= TOTAL_SLIDES; i++) {
      const slide = document.createElement('div');
      slide.className = 'slide';
      slide.id = `slide-${i}`;

      const colors = getHarmoniousColors(i);
      slide.style.backgroundColor = colors.bg;

      // Select randomly among the 4 derived styles
      const styleChoice = Math.floor(Math.sin(i * 91.73) * 10000) % 4;
      const positiveStyle = Math.abs(styleChoice);

      let textEl;

      switch (positiveStyle) {
        case 0: // Slice
          textEl = document.createElement('glitch-text');
          textEl.setAttribute('fringe', '20');
          textEl.setAttribute('shear', '40');
          textEl.setAttribute('chaos', '100');
          break;

        case 1: // Glass
          textEl = document.createElement('broken-glass-text');
          textEl.setAttribute('strength', '20');
          textEl.setAttribute('detail', '60');
          break;

        case 2: // Pixel Scatter
          textEl = document.createElement('pixel-displace-text');
          textEl.setAttribute('block-size', '14');
          textEl.setAttribute('drift', '7');
          break;

        case 3: // CRT
          textEl = document.createElement('glitch-text');
          textEl.setAttribute('fringe', '3');
          textEl.setAttribute('shear', '12');
          textEl.setAttribute('chaos', '50');
          break;
      }

      // Attributes setup
      textEl.setAttribute('text', 'COMING SOON');
      textEl.setAttribute('font-size', '100'); // Sized to fit comfortably without clipping
      textEl.setAttribute('color', colors.text);
      textEl.setAttribute('font-family', 'Montserrat, sans-serif');
      textEl.setAttribute('font-weight', '900');

      slide.appendChild(textEl);
      container.appendChild(slide);
      elementsToRender.push(textEl);
    }

    // Force canvas re-render once custom fonts and layout fully load
    function renderAllCanvases() {
      elementsToRender.forEach(el => {
        if (typeof el.render === 'function') {
          el.render();
        }
      });
    }

    if (document.fonts) {
      document.fonts.ready.then(renderAllCanvases);
    }
    window.addEventListener('load', renderAllCanvases);
  </script>
